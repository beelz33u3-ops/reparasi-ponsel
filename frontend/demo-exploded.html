<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Exploded View 3D</title>
    <!-- Font Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- GSAP & ScrollTrigger dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Tinggi web disetel panjang agar bisa di-scroll */
        .scroll-container {
            height: 300vh; 
        }

        /* Area 3D diam di tengah layar saat di-scroll */
        .sticky-view {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* Penting untuk efek kedalaman 3D */
            overflow: hidden;
        }

        /* Teks panduan di atas */
        .title-text {
            position: absolute;
            top: 10%;
            text-align: center;
            width: 100%;
            z-index: 10;
        }
        .title-text h1 { margin: 0; font-size: 2.5rem; }
        .title-text p { color: #888; margin-top: 10px; }

        /* Kumpulan kotak simulasi HP */
        .phone-container {
            position: relative;
            width: 250px;
            height: 500px;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg); /* Posisi miring 3D isometrik awal */
        }

        /* Desain dasar kotak komponen HP */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Lapisan 1: Kaca Layar */
        .layer-screen {
            background: rgba(0, 122, 255, 0.6);
            backdrop-filter: blur(10px);
            transform: translateZ(30px);
        }

        /* Lapisan 2: Baterai */
        .layer-battery {
            background: #28a745;
            height: 60%;
            top: 20%;
            transform: translateZ(10px);
        }

        /* Lapisan 3: Motherboard/Mesin */
        .layer-motherboard {
            background: #ffc107;
            height: 30%;
            top: 10%;
            width: 80%;
            left: 10%;
            transform: translateZ(0px);
        }

        /* Lapisan 4: Casing Belakang */
        .layer-casing {
            background: #333;
            transform: translateZ(-10px);
        }

        /* Teks Penjelasan (Awalnya tidak terlihat) */
        .desc-text {
            position: absolute;
            opacity: 0;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #555;
            pointer-events: none;
        }

        .desc-screen { transform: translateZ(200px) translateY(-50px); }
        .desc-battery { transform: translateX(-200px) translateZ(10px); }
        .desc-machine { transform: translateX(200px) translateZ(0px); }

    </style>
</head>
<body>

    <div class="scroll-container">
        <!-- Area Sticky -->
        <div class="sticky-view">
            
            <div class="title-text">
                <h1>Anatomi RahmatFix</h1>
                <p>Scroll ke bawah secara perlahan untuk melihat keajaiban!</p>
            </div>

            <!-- Kontainer HP 3D -->
            <div class="phone-container">
                <!-- Lapisan Bawah (Casing) -->
                <div class="layer layer-casing">Casing</div>
                
                <!-- Lapisan Mesin -->
                <div class="layer layer-motherboard">Mesin</div>
                <div class="desc-text desc-machine">Mati Total / IC Rusak</div>
                
                <!-- Lapisan Baterai -->
                <div class="layer layer-battery">Baterai</div>
                <div class="desc-text desc-battery">Ganti Baterai Drop</div>
                
                <!-- Lapisan Atas (Layar) -->
                <div class="layer layer-screen">Layar Kaca</div>
                <div class="desc-text desc-screen">Ganti LCD Retak</div>
            </div>

        </div>
    </div>

    <script>
        // Mendaftarkan plugin ScrollTrigger ke GSAP
        gsap.registerPlugin(ScrollTrigger);

        // Membuat alur waktu (Timeline) yang terhubung dengan Scroll layar
        let tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",      // Mulai saat layar ditarik dari atas
                end: "bottom bottom",  // Selesai saat mentok bawah
                scrub: 1               // Animasi mulus mengikuti pergerakan scroll (delay 1 detik)
            }
        });

        // 1. Layar terangkat ke Atas
        tl.to(".layer-screen", { z: 200, duration: 2 }, 0);
        tl.to(".desc-screen", { opacity: 1, duration: 1 }, 1);

        // 2. Baterai geser ke Kiri
        tl.to(".layer-battery", { x: -200, duration: 2 }, 1);
        tl.to(".desc-battery", { opacity: 1, duration: 1 }, 2);

        // 3. Mesin geser ke Kanan
        tl.to(".layer-motherboard", { x: 200, duration: 2 }, 2);
        tl.to(".desc-machine", { opacity: 1, duration: 1 }, 3);

        // 4. Wadah utama berputar pelan agar semakin epik
        tl.to(".phone-container", { rotateZ: 0, rotateX: 20, duration: 4 }, 0);
    </script>
</body>
</html>
