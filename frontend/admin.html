<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RahmatFix</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { padding: 50px; max-width: 1200px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: white; background: #151520; border-radius: 10px; overflow: hidden; }
        th, td { border-bottom: 1px solid #333; padding: 15px; text-align: left; }
        th { background: #0a0a0f; color: #00d2ff; }
        .status-pending { color: orange; font-weight: bold; }
        .status-done { color: #25D366; font-weight: bold; }
        #login-view { display: flex; justify-content: center; align-items: center; height: 100vh; }
        #login-form { max-width: 400px; width: 100%; background: #151520; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .action-btns button { margin-right: 5px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="dashboard-view" class="admin-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
            <h2><span class="highlight">Pusat Kendali</span> Admin</h2>
            <div style="display:flex; gap:10px;">
                <a href="index.html" class="btn-primary" style="text-decoration:none; display:inline-block; padding:10px 20px; font-weight:bold;">Lihat Website</a>
                <button id="btn-logout" class="btn-secondary" style="padding:10px 20px;">Logout</button>
            </div>
        </div>
        
        <!-- Statistik Ringkasan -->
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <div style="flex:1; background:#151520; padding:20px; border-radius:10px; border-left:4px solid #00d2ff;">
                <h3 style="margin:0; color:#aaa; font-size:14px;">Total Pesanan Aktif</h3>
                <p id="stat-active" style="font-size:24px; font-weight:bold; margin:10px 0 0; color:white;">0</p>
            </div>
            <div style="flex:1; background:#151520; padding:20px; border-radius:10px; border-left:4px solid #25D366;">
                <h3 style="margin:0; color:#aaa; font-size:14px;">Pesanan Selesai</h3>
                <p id="stat-done" style="font-size:24px; font-weight:bold; margin:10px 0 0; color:white;">0</p>
            </div>
            <div style="flex:1; background:#151520; padding:20px; border-radius:10px; border-left:4px solid #ff007f;">
                <h3 style="margin:0; color:#aaa; font-size:14px;">Estimasi Pendapatan</h3>
                <p id="stat-revenue" style="font-size:24px; font-weight:bold; margin:10px 0 0; color:white;">Rp 0</p>
            </div>
        </div>

        <!-- Task Manager Section (Assignment Requirement) -->
        <div style="background:#151520; padding:20px; border-radius:10px; margin-bottom:30px; border:1px solid #333;">
            <h3 style="margin-top:0; color:#00d2ff; border-bottom:1px solid #333; padding-bottom:10px;">Catatan Pribadi Admin (To-Do List)</h3>
            <form id="task-form" style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="new-task" placeholder="Ketik tugas baru yang harus dikerjakan..." style="flex:1; padding:10px; background:#0a0a0f; color:white; border:1px solid #333; border-radius:5px;" required>
                <button type="submit" class="btn-primary" style="padding:10px 20px; width:auto;">Tambah</button>
            </form>
            <div id="task-list" style="display:flex; flex-direction:column; gap:10px;">
                <!-- Tasks will be injected here -->
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Pelanggan</th><th>No. HP</th><th>Layanan</th><th>Status</th><th>Biaya (Rp)</th><th>Aksi</th>
                </tr>
            </thead>
            <tbody id="orders-table"></tbody>
        </table>
    </div>

    <!-- Modal Edit Pesanan -->
    <div id="edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#151520; padding:30px; border-radius:10px; width:400px; border:1px solid #333;">
            <h3 style="margin-top:0; color:#00d2ff;">Update Pesanan #<span id="edit-id-display"></span></h3>
            <input type="hidden" id="edit-id">
            
            <label style="color:#aaa; font-size:12px;">Status Pengerjaan</label>
            <select id="edit-status" style="width:100%; padding:10px; margin-bottom:15px; background:#0a0a0f; color:white; border:1px solid #333; border-radius:5px;">
                <option value="Menunggu Dikonfirmasi">Menunggu Dikonfirmasi</option>
                <option value="Sedang Diperbaiki">Sedang Diperbaiki</option>
                <option value="Menunggu Sparepart">Menunggu Sparepart</option>
                <option value="Selesai">Selesai</option>
                <option value="Sudah Diambil">Sudah Diambil</option>
            </select>
            
            <label style="color:#aaa; font-size:12px;">Total Biaya (Rp)</label>
            <input type="number" id="edit-price" placeholder="Contoh: 150000" style="width:100%; padding:10px; margin-bottom:15px; background:#0a0a0f; color:white; border:1px solid #333; border-radius:5px; box-sizing:border-box;">
            
            <label style="color:#aaa; font-size:12px;">Catatan/Diagnosa Teknisi</label>
            <textarea id="edit-notes" placeholder="Catatan untuk pelanggan..." style="width:100%; padding:10px; margin-bottom:20px; background:#0a0a0f; color:white; border:1px solid #333; border-radius:5px; height:80px; box-sizing:border-box;"></textarea>
            
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeModal()" class="btn-secondary" style="padding:10px 15px;">Batal</button>
                <button onclick="saveUpdate()" class="btn-primary" style="padding:10px 15px;">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        // Cek Keamanan Admin
        if (localStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'login.html';
        }

        const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') 
            ? 'http://localhost:3001/api' 
            : 'https://reparasi-ponsel-production.up.railway.app/api';
        let allOrders = [];

        document.getElementById('btn-logout').onclick = () => {
            localStorage.clear();
            window.location.href = 'login.html';
        };

        async function loadOrders() {
            try {
                const res = await fetch(API + '/orders');
                allOrders = await res.json();
                const tbody = document.getElementById('orders-table');
                tbody.innerHTML = '';
                
                let activeCount = 0;
                let doneCount = 0;
                let totalRevenue = 0;

                if(allOrders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada pesanan masuk.</td></tr>';
                } else {
                    allOrders.forEach(o => {
                        // Kalkulasi statistik
                        if(o.status === 'Selesai' || o.status === 'Sudah Diambil') {
                            doneCount++;
                            totalRevenue += (o.price || 0);
                        } else {
                            activeCount++;
                        }

                        let statusColor = 'orange';
                        if(o.status === 'Selesai') statusColor = '#25D366';
                        if(o.status === 'Sudah Diambil') statusColor = '#aaa';
                        if(o.status === 'Menunggu Sparepart') statusColor = '#ff007f';

                        tbody.innerHTML += `
                            <tr>
                                <td>#${o.id}</td>
                                <td><b>${o.customer_name}</b><br><span style="font-size:12px;color:#aaa">${o.issue_desc.substring(0,30)}...</span></td>
                                <td>${o.phone}</td>
                                <td>${o.service_type}</td>
                                <td style="color:${statusColor}; font-weight:bold;">${o.status}</td>
                                <td>Rp ${o.price ? o.price.toLocaleString('id-ID') : 0}</td>
                                <td class="action-btns">
                                    <button onclick="openModal(${o.id})" class="btn-primary" style="padding:8px 15px; font-size:12px; border:none;">✏️ Update</button>
                                    <button onclick="deleteOrder(${o.id})" class="btn-secondary" style="padding:8px 15px; font-size:12px; border-color:#dc3545; color:#dc3545;">🗑</button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                // Update Statistik UI
                document.getElementById('stat-active').innerText = activeCount;
                document.getElementById('stat-done').innerText = doneCount;
                document.getElementById('stat-revenue').innerText = 'Rp ' + totalRevenue.toLocaleString('id-ID');

            } catch (err) {
                console.error(err);
            }
        }

        function openModal(id) {
            const order = allOrders.find(o => o.id === id);
            if(!order) return;
            document.getElementById('edit-id').value = order.id;
            document.getElementById('edit-id-display').innerText = order.id;
            document.getElementById('edit-status').value = order.status;
            document.getElementById('edit-price').value = order.price || 0;
            document.getElementById('edit-notes').value = order.admin_notes || '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveUpdate() {
            const id = document.getElementById('edit-id').value;
            const status = document.getElementById('edit-status').value;
            const price = parseInt(document.getElementById('edit-price').value) || 0;
            const admin_notes = document.getElementById('edit-notes').value;

            try {
                await fetch(API + '/orders/' + id, { 
                    method:'PUT', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify({status, price, admin_notes})
                });
                closeModal();
                loadOrders();
            } catch(e) {
                alert('Gagal mengupdate pesanan');
            }
        }
        
        async function deleteOrder(id) {
            if(confirm('Anda yakin ingin menghapus pesanan ini secara permanen?')) {
                await fetch(API + '/orders/' + id, { method:'DELETE'});
                loadOrders();
            }
        }

        loadOrders();
        
        // --- TASK MANAGER LOGIC ---
        async function loadTasks() {
            try {
                const res = await fetch(API + '/tasks');
                const tasks = await res.json();
                const list = document.getElementById('task-list');
                list.innerHTML = '';
                if(tasks.length === 0) {
                    list.innerHTML = '<p style="color:#aaa; font-size:14px; text-align:center;">Belum ada tugas/catatan.</p>';
                    return;
                }
                tasks.forEach(t => {
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.justifyContent = 'space-between';
                    div.style.alignItems = 'center';
                    div.style.padding = '10px 15px';
                    div.style.background = '#0a0a0f';
                    div.style.borderRadius = '5px';
                    div.style.border = '1px solid #333';
                    
                    const textStyle = t.completed ? 'text-decoration:line-through; color:#aaa;' : 'color:white;';
                    const checkColor = t.completed ? '#25D366' : '#555';
                    
                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:15px; flex:1; cursor:pointer;" onclick="toggleTask(${t.id}, ${!t.completed})">
                            <div style="width:20px; height:20px; border-radius:4px; border:2px solid ${checkColor}; background:${t.completed ? '#25D366' : 'transparent'}; display:flex; justify-content:center; align-items:center; color:white; font-size:12px;">
                                ${t.completed ? '✓' : ''}
                            </div>
                            <span style="${textStyle}">${t.title}</span>
                        </div>
                        <button onclick="deleteTask(${t.id})" style="background:transparent; border:none; color:#dc3545; cursor:pointer; padding:5px;">🗑 Hapus</button>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('task-form').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('new-task').value;
            try {
                await fetch(API + '/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title})});
                document.getElementById('new-task').value = '';
                loadTasks();
            } catch(e) { console.error(e); }
        };

        async function toggleTask(id, completed) {
            try {
                await fetch(API + '/tasks/' + id, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({completed})});
                loadTasks();
            } catch(e) { console.error(e); }
        }

        async function deleteTask(id) {
            if(confirm('Hapus tugas ini?')) {
                await fetch(API + '/tasks/' + id, { method:'DELETE'});
                loadTasks();
            }
        }
        
        loadTasks();
    </script>

</body>
</html>
